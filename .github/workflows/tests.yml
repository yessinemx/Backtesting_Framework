name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  unittest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "polars>=1.40.0" \
            "pandas==2.2.3" \
            "numpy==2.1.3" \
            "pyarrow==19.0.0" \
            "fastparquet==2024.11.0" \
            "duckdb==1.2.1" \
            "PyWavelets>=1.5.0" \
            "statsmodels>=0.14.0" \
            "scipy>=1.11.0" \
            "plotly==5.24.1" \
            "streamlit>=1.28.0" \
            "python-dateutil==2.9.0.post0"

      - name: Run test suite
        run: python -m unittest discover -s tests

      - name: Check research CLI help
        run: python research/main.py --help